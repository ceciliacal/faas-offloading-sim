regions:  #cloud regions
  - name: "cloud_region_a"
    co2_traces_file: "co2_traces/IT-NO_2023_hourly.csv"
    neighbors:
      - "cloud_region_b"
      #- "cloud_region_c"
    latency_sec:
      cloud_region_a: 0.001
      cloud_region_b: 0.020
      cloud_region_c: 0.100
    bandwidth_mbps:
      cloud_region_a: 10000.0
      cloud_region_b: 5000.0
      cloud_region_c: 1000.0

    zones:  #edge regions referring to this cloud region
      - name: "edge_zone_1"
        co2_traces_file: "co2_traces/IT-CSO_2023_hourly.csv"
        latency_sec:
          cloud_region_a: 0.010
          cloud_region_b: 0.100
          cloud_region_c: 0.500
          edge_zone_1:    0.005
        bandwidth_mbps:
          cloud_region_a: 5000.0
          cloud_region_b: 2500.0
          cloud_region_c: 1000.0
          edge_zone_1:    10000.0
      - name: "edge_zone_2"
        co2_traces_file: "co2_traces/IT-CNO_2023_hourly.csv"
        latency_sec:
          cloud_region_a: 0.010
          cloud_region_b: 0.100
          cloud_region_c: 0.500
          edge_zone_2:    0.005
        bandwidth_mbps:
          cloud_region_a: 5000.0
          cloud_region_b: 2500.0
          cloud_region_c: 1000.0
          edge_zone_2:    10000.0

  - name: "cloud_region_b"
    co2_traces_file: "co2_traces/FR_2023_hourly.csv"
    neighbors:
      - "cloud_region_a"
      #- "cloud_region_c"
    latency_sec:
      cloud_region_a: 0.020     #neighbor (20ms)
      cloud_region_b: 0.001     #self (1ms)
      cloud_region_c: 0.100
    bandwidth_mbps:
      cloud_region_a: 5000.0    #neighbor
      cloud_region_b: 10000.0   #self
      cloud_region_c: 1000.0    #regione lontana

  - name: "cloud_region_c"
    co2_traces_file: "co2_traces/FR_2023_hourly.csv" #TODO: qui metti islanda
    neighbors:
      #- "cloud_region_a"
      #- "cloud_region_b"
    latency_sec:
      cloud_region_a: 0.100
      cloud_region_b: 0.100
      cloud_region_c: 0.001
    bandwidth_mbps:
      cloud_region_a: 1000.0
      cloud_region_b: 1000.0
      cloud_region_c: 10000.0
