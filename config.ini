[simulation]
stats-print-interval = 1200
stats-print-file = stats.txt
close-door-time = 100000
#259200

plot-rt = false
seed = 1
spec-file = spec.yml
enable-approximate-computing = True

[policy]
name = probabilistic-carbon-aware
budget = 0.5
#split-budget-edge = True
update-interval = 600
arrival-alpha = 0.3
local-cold-start-estimation = naive
cloud-cold-start-estimation = naive
edge-cold-start-estimation = naive

of-alpha = 1.0
of-beta = 0.0

[container]
init-time = 1.1
utilization-update-interval = 0.1

[carbon]
update-interval = 3600
start-date = 2023-01-01
end-date = 2023-01-07
regions-file = regions.yml
latency-update-interval = 1800
latency-dev-st = 0.005
latency-cap = 0.025


[dispatcher]
update-interval = 300