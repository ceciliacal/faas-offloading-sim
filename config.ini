[simulation]
stats-print-interval = 1200
stats-print-file = stats.txt
close-door-time = 10000
plot-rt = false
seed = 123
spec-file = spec.yml

[policy]
name = probabilistic-energy-aware
update-interval = 120
arrival-alpha = 0.3

[container]
init-time = 1.1

[battery]
update-interval = 1
energy-per-data-size = 0.001
co2-emission-update-interval = 180
co2-emission-number-updates = 3

[carbon]
update-interval = 3600
num-regions-cloud = 2
num-regions-edge = 2
edge_neighbors_per_region = 1
file-edge1 = co2_traces/IT-CNO_2023_hourly.csv
file-edge2 = co2_traces/IT-CSO_2023_hourly.csv
file-cloud1 = co2_traces/IT-NO_2023_hourly.csv
file-cloud2 = co2_traces/FR_2023_hourly.csv
start-date = 2023-01-01
end-date = 2023-01-07
regions-file = regions.yml

[dispatcher]
update-interval = 20