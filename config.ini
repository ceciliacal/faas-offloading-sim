[simulation]
stats-print-interval = 1200
stats-print-file = stats.txt
close-door-time = 259200
#259200
#close-door-time = 500

plot-rt = false
seed = 1
spec-file = spec_variants_1.yaml
enable-approximate-computing = False

[policy]
name = probabilistic-carbon-aware
budget = 50
#split-budget-edge = True
update-interval = 600
arrival-alpha = 0.3
local-cold-start-estimation = naive
cloud-cold-start-estimation = naive
edge-cold-start-estimation = naive

of-alpha = 0.5
of-beta = 0.5

[container]
init-time = 1.1

[carbon]
update-interval = 3600
start-date = 2023-01-01
end-date = 2023-01-07
regions-file = regions.yml
file-update-co2-intensity = "prova.csv"

[dispatcher]
update-interval = 350