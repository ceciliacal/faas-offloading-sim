[simulation]
stats-print-interval = 1200
stats-print-file = stats.txt
close-door-time = 100000
plot-rt = false
seed = 123
spec-file = spec.yml
enable-approximate-computing = True

[policy]
name = basic-multi-region
budget = 0.2
update-interval = 120
arrival-alpha = 0.3
#local-cold-start-estimation = pacs
#cloud-cold-start-estimation = naive
#edge-cold-start-estimation = naive

of-alpha = 1.0
of-beta = 0.0

[container]
init-time = 1.1

[carbon]
update-interval = 3600
start-date = 2023-01-01
end-date = 2023-01-01
regions-file = regions.yml

[dispatcher]
update-interval = 20